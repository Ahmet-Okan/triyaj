<script id="motor">
(function (root) {
  "use strict";

  var VITAL_AD = { ates: "Ateş", nabiz: "Nabız", spo2: "SpO₂", ta: "Tansiyon", solunum: "Solunum", seker: "Kan şekeri", gks: "GKS", ritim: "Ritim" };
  var EPS = 1e-6;

  /* ---------- yardımcılar ---------- */
  function bul(liste, id) { if (!liste) return null; for (var i = 0; i < liste.length; i++) if (liste[i].id === id) return liste[i]; return null; }
  function birlestir() {
    var o = {};
    for (var i = 0; i < arguments.length; i++) { var a = arguments[i]; if (a) for (var k in a) if (Object.prototype.hasOwnProperty.call(a, k)) o[k] = a[k]; }
    return o;
  }
  function p2(x) { return (x < 10 ? "0" : "") + x; }
  function sayi(n, ondalik) {
    var neg = n < 0; n = Math.abs(n);
    var s = ondalik ? n.toFixed(ondalik) : String(Math.round(n));
    var par = s.split(".");
    par[0] = par[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return (neg ? "−" : "") + par.join(",");
  }
  function tl(n) { return sayi(n) + " ₺"; }
  function saatYaz(sn) {
    sn = Math.max(0, Math.floor(sn + EPS));
    var h = Math.floor(sn / 3600), m = Math.floor((sn % 3600) / 60), s = sn % 60;
    return h ? h + ":" + p2(m) + ":" + p2(s) : p2(m) + ":" + p2(s);
  }
  function sureYaz(sn) {
    sn = Math.round(sn);
    if (sn < 60) return sn + " sn";
    if (sn < 3600) { var d = Math.floor(sn / 60), r = sn % 60; return d + " dk" + (r ? " " + r + " sn" : ""); }
    var h = Math.floor(sn / 3600), dk = Math.round((sn % 3600) / 60);
    return h + " sa" + (dk ? " " + dk + " dk" : "");
  }
  function bicimVital(k, v) {
    if (v === null || v === undefined) return "alınamıyor";
    switch (k) {
      case "ates": return sayi(v, 1) + " °C";
      case "nabiz": return v + "/dk";
      case "spo2": return "%" + v;
      case "ta": return v + " mmHg";
      case "solunum": return v + "/dk";
      case "seker": return v + " mg/dL";
      default: return String(v);
    }
  }
  // Düz metin ya da { varsayilan, <durum>: ... } nesnesi
  function metinSec(x, durum) {
    if (x === null || x === undefined) return null;
    if (typeof x === "string") return x;
    return x[durum] !== undefined ? x[durum] : x.varsayilan;
  }

  /* ---------- vaka verisine erişim ---------- */
  function tetkikBilgisi(s, id) {
    var k = bul(s.ayar.tetkikler, id); if (!k) return null;
    return birlestir({ sinif: "notr", sonuc: "Normal." }, k, (s.vaka.tetkikler || {})[id]);
  }
  function mudahaleBilgisi(s, id) {
    var k = bul(s.ayar.mudahaleler, id); if (!k) return null;
    return birlestir({ sinif: "gereksiz", not: "Bu vakada gerekli değildi." }, k, (s.vaka.mudahaleler || {})[id]);
  }
  function vitallerAt(s, d) { return birlestir(s.vaka.durumlar.baslangic.vitaller, (s.vaka.durumlar[d] || {}).vitaller); }
  function anlikVitaller(s) { return vitallerAt(s, s.durum); }

  /* ---------- hasta seyri ---------- */
  // Seyir kurallarından olası durum değişimlerinin zaman çizelgesi (şu ana kadarki işlemlere göre).
  function seyirOlaylari(s) {
    var ol = [];
    (s.vaka.seyir || []).forEach(function (r, i) {
      if (r.mudahale) {
        var tm = s.yapilan[r.mudahale];
        if (tm != null) ol.push({ t: tm + (r.sonraDk || 0) * 60, durum: r.durum, sadece: r.sadece, sira: 1, i: i });
      } else {
        var T = r.saatDk * 60;
        var onlendi = (r.onleyen || []).some(function (id) { var x = s.yapilan[id]; return x != null && x < T - EPS; });
        if (!onlendi) ol.push({ t: T, durum: r.durum, sadece: r.sadece, sira: 0, i: i });
      }
    });
    ol.sort(function (a, b) { return (a.t - b.t) || (a.sira - b.sira) || (a.i - b.i); });
    return ol;
  }
  function durumAt(s, t) {
    var cur = "baslangic", ol = seyirOlaylari(s);
    for (var k = 0; k < ol.length; k++) {
      var e = ol[k];
      if (e.t > t + EPS) break;
      if (e.sadece && e.sadece.indexOf(cur) < 0) continue;
      cur = e.durum;
      if ((s.vaka.durumlar[cur] || {}).kayip) break;
    }
    return cur;
  }
  // Şu andan "sinir"a kadar, hiçbir şey yapılmazsa durumun değişeceği ilk an (yoksa null).
  function sonrakiDegisim(s, sinir) {
    var ol = seyirOlaylari(s);
    for (var i = 0; i < ol.length; i++) {
      var e = ol[i];
      if (e.t <= s.t + EPS || e.t > sinir + EPS) continue;
      if (durumAt(s, e.t) !== s.durum) return e.t;
    }
    return null;
  }

  /* ---------- çekirdek ---------- */
  function kayit(s, tur, metin) { s.gunluk.push({ t: s.t, tur: tur, metin: metin }); s.surum++; }

  function sonuclariIsle(s) {
    Object.keys(s.tetkik).sort(function (a, b) { return s.tetkik[a].hazir - s.tetkik[b].hazir; }).forEach(function (id) {
      var p = s.tetkik[id];
      if (!p.geldi && p.hazir <= s.t + EPS) {
        p.geldi = true;
        var b = tetkikBilgisi(s, id);
        p.sonuc = metinSec(b.sonuc, p.durum) || "Normal.";
        kayit(s, "sonuc", b.ad + ": " + p.sonuc);
      }
    });
  }
  function durumKontrol(s) {
    var d = durumAt(s, s.t);
    if (d === s.durum) return;
    s.durum = d;
    if (s.gorulenDurumlar.indexOf(d) < 0) s.gorulenDurumlar.push(d);
    var b = s.vaka.durumlar[d] || {};
    kayit(s, b.iyi ? "iyi" : "durum", b.mesaj || "Hastanın durumu değişti.");
    if (b.kayip) { s.kayip = true; s.bitti = true; s.bitis = "kayip"; s.kayipT = s.t; kayit(s, "durum", "Vaka kaybedildi."); }
  }
  // Saati dt saniye ileri sarar; aradaki sonuçları ve durum değişimlerini sırayla işler.
  function ilerlet(s, dt) {
    if (s.bitti || !(dt > 0)) return;
    var hedef = s.t + dt, guvenlik = 0;
    while (!s.bitti && s.t < hedef - EPS && guvenlik++ < 500) {
      var sonraki = hedef;
      for (var id in s.tetkik) { var p = s.tetkik[id]; if (!p.geldi && p.hazir > s.t + EPS && p.hazir < sonraki) sonraki = p.hazir; }
      var ol = seyirOlaylari(s);
      for (var i = 0; i < ol.length; i++) if (ol[i].t > s.t + EPS && ol[i].t < sonraki) sonraki = ol[i].t;
      s.t = sonraki;
      sonuclariIsle(s);
      durumKontrol(s);
    }
    if (!s.bitti) s.t = Math.max(s.t, hedef);
  }

  // Vazgeçme: son işlemden önceki kopyaya döner ve saati bugüne kadar ilerletir.
  // Zaman geri gelmez (o süre geçti), maliyet geri gelir; işlem hiç yapılmamış gibi seyir yeniden hesaplanır.
  function kopya(s) {
    var v = s.vaka, a = s.ayar; s.vaka = null; s.ayar = null;
    var k = JSON.parse(JSON.stringify(s));
    s.vaka = v; s.ayar = a; k.vaka = v; k.ayar = a;
    return k;
  }
  function geriAl(onceki, t, ad) {
    var s = kopya(onceki);
    ilerlet(s, t - s.t);
    if (!s.bitti) kayit(s, "sen", "Vazgeçildi: " + ad + ".");
    return s;
  }

  function yeniOyun(vaka, ayar) {
    var s = {
      vaka: vaka, ayar: ayar, t: 0, maliyet: 0, surum: 0,
      durum: "baslangic", gorulenDurumlar: ["baslangic"],
      olcum: {}, monitor: null, sorulan: {}, gecmis: {}, enabiz: null, muayene: {}, tetkik: {},
      yapilan: {}, yapilanDurum: {}, sira: [], gunluk: [],
      bitti: false, kayip: false, kayipT: null, tani: null, bitis: null
    };
    kayit(s, "sistem", "Hasta acile geldi: " + vaka.hasta.cinsiyet.toLocaleLowerCase("tr") + ", " + vaka.hasta.yas + " yaş.");
    return s;
  }
  var BITTI = { ok: false, neden: "bitti" };

  /* ---------- serbest soru eşleştirme (çevrimdışı, yapay zekâ yok) ----------
     Öğrencinin yazdığı soruyu vakadaki hazır sorulardan (öykü + hastaya/yakına sorulan geçmiş) en uygununa eşler.
     Türkçe ekler kaba biçimde atılır (ilk 4 harf kök), eş anlamlılar kavrama çevrilir, nadir kelime daha çok puan alır.
     Cevaplar her zaman vakadaki hazır, onaylı metinlerdir; sistem cevap uydurmaz. */
  var SS_DUR = {};
  ("ne mi mı mu mü var yok bir ve ya da de ki siz sizin size sen senin misiniz mısınız musunuz müsünüz miydi mıydı mısın misin musun müsün " +
   "bu şu o çok hiç daha gibi için ile hocam peki acaba herhangi bana söyler söyle anlatır anlat şey şimdi oldu olur olduğu oluyor " +
   "neler nedir nasılsınız lütfen merhaba iyi akşamlar olan").split(" ").forEach(function (w) { SS_DUR[ssNorm(w)] = 1; });
  function ssNorm(x) {
    return String(x).toLocaleLowerCase("tr").replace(/i̇/g, "i").replace(/ç/g, "c").replace(/ş/g, "s").replace(/ğ/g, "g")
      .replace(/ı/g, "i").replace(/ö/g, "o").replace(/ü/g, "u").replace(/â/g, "a").replace(/î/g, "i");
  }
  var SS_ES = [
    ["ZAMAN", "zaman saat saattir gun gundur dakika basladi baslangic sure suredir once kac sabah aksam dun gece ne_zaman"],
    ["AGRI", "agri agriyor sanci sizi aci aciyor"],
    ["YAYIL", "yayiliyor yayilim vuruyor gidiyor kola kolu kolum sirt sirtiniza cene omuz kasik kasiga"],
    ["NITELIK", "nasil tarif nitelik tur benziyor baski sikisma batma yanma zonklama"],
    ["ESLIK", "terleme terliyor bulanti kusma kustu eslik"],
    ["NEFES", "nefes soluk daralma bogulma"],
    ["POZ", "pozisyon yatinca oturunca kalkinca degisiyor"],
    ["HASTALIK", "hastalik hasta kronik tansiyon seker diyabet kalp sorun"],
    ["ILAC", "ilac hap kullandiginiz kullaniyor recete"],
    ["ALERJI", "alerji alerjik kasinti"],
    ["SIGARA", "sigara alkol icki"],
    ["AILE", "aile ailede anne baba kardes akraba soygecmis"],
    ["ATES", "ates titreme usume"],
    ["ISHAL", "ishal tuvalet diski kabizlik"],
    ["IDRAR", "idrar ciş cis"],
    ["GEBELIK", "gebe gebelik hamile hamilelik adet regl"],
    ["YEMEK", "yemek yedi yediniz istah icti"],
    ["ISINMA", "isinma isitiyor isitma soba kalorifer sofben komur"],
    ["EV", "evde ev evdeki baska kimse"],
    ["SOKMA", "ari sokma soktu bocek"],
    ["AMELIYAT", "ameliyat operasyon"],
    ["BAYILMA", "bayilma bayilacak dondu donuyor donmesi karariyor"]
  ];
  var SS_KAVRAM = {};
  SS_ES.forEach(function (g) { g[1].split(" ").forEach(function (w) { SS_KAVRAM[ssNorm(w).replace(/_/g, " ").slice(0, 4)] = g[0]; }); });
  function ssJeton(metin) {
    var j = {};
    ssNorm(metin).replace(/ne zaman/g, "ne_zaman").split(/[^a-z0-9_]+/).forEach(function (w) {
      if (w.length < 2 || SS_DUR[w]) return;
      var k = w.replace(/_/g, " ").slice(0, 4); j[k] = 1;
      if (SS_KAVRAM[k]) j[SS_KAVRAM[k]] = 1;
    });
    return j;
  }
  // Sıralı eşleşmeler: [{ tip: "soru" | "gecmis", id, metin, puan }]
  function soruEsle(vaka, metin) {
    var aday = [];
    vaka.oyku.forEach(function (q) { aday.push({ tip: "soru", id: q.id, metin: q.soru, j: ssJeton(q.soru + " " + (q.anahtar || "")) }); });
    (vaka.gecmis || []).forEach(function (g) {
      if (g.kaynak === "enabiz") return;
      aday.push({ tip: "gecmis", id: g.id, metin: g.ad, j: ssJeton(g.ad + " " + (g.ozet || "") + " " + (g.anahtar || "")) });
    });
    var df = {}, N = aday.length;
    aday.forEach(function (a) { for (var t in a.j) df[t] = (df[t] || 0) + 1; });
    var u = ssJeton(metin);
    return aday.map(function (a) {
      var p = 0, n = Object.keys(a.j).length || 1;
      for (var t in u) if (a.j[t]) p += Math.log(1 + N / df[t]);
      return { tip: a.tip, id: a.id, metin: a.metin, puan: p / Math.sqrt(n) };
    }).sort(function (x, y) { return (y.puan - x.puan) || (x.tip === "soru" ? -1 : 1); });
  }

  /* ---------- işlemler ---------- */
  function vitalOlc(s, id) {
    if (s.bitti) return BITTI;
    var v = bul(s.ayar.vitaller, id); if (!v) return { ok: false, neden: "yok" };
    ilerlet(s, v.sureSn); if (s.bitti) return BITTI;
    var deg = anlikVitaller(s), parca = [];
    v.gosterir.forEach(function (k, i) {
      s.olcum[k] = { deger: deg[k], t: s.t, kaynak: id };
      parca.push((i > 0 ? VITAL_AD[k].toLocaleLowerCase("tr") + " " : "") + bicimVital(k, deg[k]));
    });
    s.sira.push("vital:" + id);
    kayit(s, "vital", v.ad + " ölçüldü: " + parca.join(" · "));
    return { ok: true };
  }
  function monitoreBagla(s) {
    if (s.bitti) return BITTI;
    if (s.monitor != null) return { ok: false, neden: "zaten" };
    ilerlet(s, s.ayar.monitorSn); if (s.bitti) return BITTI;
    s.monitor = s.t; s.yapilan.monitor = s.t; s.sira.push("monitor");
    kayit(s, "vital", "Monitöre bağlandı: nabız, SpO₂, tansiyon ve ritim artık sürekli görünüyor.");
    return { ok: true };
  }
  function soruSor(s, id) {
    if (s.bitti) return BITTI;
    var q = bul(s.vaka.oyku, id); if (!q) return { ok: false, neden: "yok" };
    if (s.sorulan[id] && !s.sorulan[id].cevapsiz) return { ok: false, neden: "zaten" };
    ilerlet(s, s.ayar.oykuSn); if (s.bitti) return BITTI;
    var d = s.vaka.durumlar[s.durum] || {};
    var c = d.oykuCevabi || metinSec(q.cevap, s.durum);
    s.sorulan[id] = { t: s.t, cevap: c, cevapsiz: !!d.oykuCevabi };
    s.sira.push("oyku");
    kayit(s, "oyku", q.soru + " → " + c);
    return { ok: true };
  }
  // Hasta geçmişi: hastaya ya da yakınına sorulur, ya da e-Nabız'dan bakılır. Puanı etkilemez, sadece süre yer.
  var KAYNAK_AD = { hasta: "Hasta", yakin: "Yakını", enabiz: "e-Nabız" };
  function gecmisBak(s, id) {
    if (s.bitti) return BITTI;
    var g = bul(s.vaka.gecmis, id); if (!g) return { ok: false, neden: "yok" };
    if (s.gecmis[id] && !s.gecmis[id].cevapsiz) return { ok: false, neden: "zaten" };
    ilerlet(s, (s.ayar.gecmisSn || {})[g.kaynak] || s.ayar.oykuSn); if (s.bitti) return BITTI;
    var d = s.vaka.durumlar[s.durum] || {};
    var cevapsiz = g.kaynak === "hasta" && !!d.oykuCevabi;
    var c = cevapsiz ? d.oykuCevabi : metinSec(g.cevap, s.durum);
    s.gecmis[id] = { t: s.t, cevap: c, cevapsiz: cevapsiz };
    s.sira.push("gecmis");
    kayit(s, "gecmis", g.ad + ": " + c);
    s.gunluk[s.gunluk.length - 1].kaynak = g.kaynak;
    return { ok: true };
  }
  // e-Nabız: önce hasta sorgulanır (30 sn), sonra her bölümün ilk açılışı 10 sn. Görülen satırlar ilgili geçmiş kaydını "bakıldı" yapar.
  var ENABIZ_BOLUM = ["ziyaretler", "tahliller", "receteler", "asilar", "hastaliklar", "alerjiler", "radyoloji"];
  function enabizAc(s) {
    if (s.bitti) return BITTI;
    if (s.enabiz) return { ok: true, zaten: true };
    ilerlet(s, s.ayar.enabizSn || 30); if (s.bitti) return BITTI;
    s.enabiz = { t: s.t, bolum: {} };
    s.sira.push("enabiz");
    kayit(s, "gecmis", "e-Nabız: hasta sorgulandı, kayıtlar açıldı.");
    s.gunluk[s.gunluk.length - 1].kaynak = "enabiz";
    return { ok: true };
  }
  function enabizBolum(s, b) {
    if (s.bitti) return BITTI;
    if (!s.enabiz) return { ok: false, neden: "kapali" };
    if (ENABIZ_BOLUM.indexOf(b) < 0) return { ok: false, neden: "yok" };
    if (s.enabiz.bolum[b] != null) return { ok: true, zaten: true };
    ilerlet(s, s.ayar.enabizBolumSn || 10); if (s.bitti) return BITTI;
    s.enabiz.bolum[b] = s.t;
    ((s.vaka.enabiz || {})[b] || []).forEach(function (r) {
      if (r.gecmisId && !s.gecmis[r.gecmisId]) s.gecmis[r.gecmisId] = { t: s.t, cevap: "e-Nabız kaydında görüldü.", enabiz: true };
    });
    s.surum++;
    return { ok: true };
  }
  function muayeneEt(s, id) {
    if (s.bitti) return BITTI;
    var m = bul(s.ayar.muayeneSistemleri, id); if (!m) return { ok: false, neden: "yok" };
    ilerlet(s, s.ayar.muayeneSn); if (s.bitti) return BITTI;
    var bulgu = metinSec((s.vaka.muayene || {})[id], s.durum) || "Olağan.";
    s.muayene[id] = { t: s.t, bulgu: bulgu };
    s.sira.push("muayene");
    kayit(s, "muayene", m.ad + ": " + bulgu);
    return { ok: true };
  }
  function tetkikIste(s, id) {
    if (s.bitti) return BITTI;
    var b = tetkikBilgisi(s, id); if (!b) return { ok: false, neden: "yok" };
    if (s.tetkik[id]) return { ok: false, neden: "zaten" };
    s.tetkik[id] = { istek: s.t, hazir: s.t + b.sureSn, geldi: false, durum: s.durum, sonuc: null };
    s.maliyet += b.ucret || 0;
    s.sira.push("tetkik:" + id);
    kayit(s, "tetkik", b.ad + " istendi (sonuç " + sureYaz(b.sureSn) + " sonra" + (b.ucret ? " · " + tl(b.ucret) : "") + ").");
    ilerlet(s, s.ayar.tetkikIstekSn);
    return { ok: !s.bitti };
  }
  function mudahaleYap(s, id) {
    if (s.bitti) return BITTI;
    var m = mudahaleBilgisi(s, id); if (!m) return { ok: false, neden: "yok" };
    if (s.yapilan[id] != null) return { ok: false, neden: "zaten" };
    if (m.onkosul && s.yapilan[m.onkosul] == null) return { ok: false, neden: "onkosul", onkosul: m.onkosul };
    if (m.bitirir) return taburcuEt(s, null);
    ilerlet(s, m.sureSn); if (s.bitti) return BITTI;
    s.sira.push("mudahale:" + id);
    if (m.gerekenSonuc && !(s.tetkik[m.gerekenSonuc] && s.tetkik[m.gerekenSonuc].geldi)) {
      kayit(s, "mudahale", m.gerekenYoksa || (m.ad + ": şimdi yapılamadı."));
      return { ok: true, reddedildi: true };
    }
    s.yapilan[id] = s.t; s.yapilanDurum[id] = s.durum;
    kayit(s, "mudahale", m.yanit || (m.ad + " yapıldı."));
    durumKontrol(s);
    return { ok: true };
  }
  function bitir(s, taniId, neden) {
    if (s.bitti) return BITTI;
    s.bitti = true; s.tani = taniId || null; s.bitis = neden || "tani";
    var tn = taniId ? bul(s.vaka.tanilar, taniId) : null;
    kayit(s, "sistem", (s.bitis === "taburcu" ? "Vaka kapandı." : "Yönetim bitti.") + (tn ? " Tanı: " + tn.ad + "." : " Tanı konmadı."));
    return { ok: true };

    { hedef: "#pVital", tel: "hasta", pencereKapat: true, metin: "Vitaller kapalı, ölçmeden göremezsin. Monitöre bağla ya da tek tek ölç. Her ölçüm vaka saatinden zaman yer." },
    { hedef: "#pNav", metin: "Kararların solda: bir öykü ve geçmiş, iki muayene, üç tetkik, dört müdahale, beş tanı. Tıklayınca büyük pencere açılır, Esc kapatır. N tuşu e-Nabız'ı açar." },
    { hedef: ".serbest", sekme: "oyku", metin: "Hastaya istediğini yazarak sorabilirsin. Anlamazsa sana en yakın soruları önerir." },
    { hedef: ".ust", metin: "Üst çubuk dikkat isteyen her şeyi gösterir: kötüleşme, gelen sonuç, bekleyen tetkik. Tıklayınca oraya gidersin. Space ile duraklatırsın." },
    { hedef: "#pHemsire .ercan-dugme", metin: "Ben sağ alttayım. Bir şey dersem balon çıkar, arada soru da sorarım. Eski mesajlar ve danışmak için üstüme tıkla, puanını kırmam." },
    { hedef: ".alt-eylem", metin: "Tetkik sonuçları arka planda gelir. Sonucu bekle düğmesi saati ileri sarar. Alttaki zaman şeridine tıklarsan bütün olayları görürsün." },
    { hedef: "#pMasa", hedefTel: ".masa-ust", metin: "Burası masan hocam. Cevapların, sonuçların, benim söylediklerimin yanındaki küçük raptiyeye basarsan masaya düşer, M tuşu açar. Sonuç gelince sol altta kâğıt belirir. Hazırsan saat şimdi başlıyor." }
  ];
  function rehberIstekOku() { try { return localStorage.getItem("triyaj-rehber") !== "bitti"; } catch (e) { return true; } }
  ui.rehberIste = rehberIstekOku();
  function rehberBaslat() {
    if (!ui.s || ui.s.bitti || ui.ekran !== "vaka") return;
    if ($("ayar") || ui.yakinAcik || (ui.olaylar && ui.olaylar.acik)) { setTimeout(rehberBaslat, 800); return; } // ayarlar, hasta yakını ya da vaka akışı açıkken bekler
    ui.rehberAdim = 0; ui.duraklat = true; render(); rehberCiz();
  }
  function rehberCiz() {
    document.querySelectorAll(".rehber-hedef").forEach(function (x) { x.classList.remove("rehber-hedef"); });
    var a = REHBER[ui.rehberAdim];
    if (!a) { rehberBitir(true); return; }
    if (a.pencereKapat && pc() && ui.pencere) { ui.pencere = false; render(); }
    if (a.sekme) sekmeSec(a.sekme); else if (a.tel && !genis()) sekmeSec(a.tel);
    var el = $("rehber");
    if (!el) {
      el = document.createElement("div"); el.id = "rehber"; el.className = "rehber"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "Rehber");
      document.body.appendChild(el);
      el.addEventListener("click", function (e) { var b = e.target.closest("[data-r]"); if (!b) return; if (b.getAttribute("data-r") === "ileri") { ui.rehberAdim++; rehberCiz(); } else rehberBitir(true); });
    }
    var son = ui.rehberAdim === REHBER.length - 1;
    el.innerHTML = (H ? '<img src="' + esc(H.portre) + '" alt="">' : "") + '<div><p class="rehber-adim">Rehber · ' + (ui.rehberAdim + 1) + " / " + REHBER.length + "</p>" +
      '<p class="replik"><span class="kim hms-k">Ercan Abi</span> – ' + tx(a.metin) + "</p>" +
      '<div class="rehber-btn"><button type="button" class="btn kucuk" data-r="ileri">' + (son ? "Başla" : "İleri · Enter") + '</button><button type="button" class="btn kucuk ikincil" data-r="kapat">Rehberi kapat</button></div></div>';
    var hedef = document.querySelector(!pc() && a.hedefTel ? a.hedefTel : a.hedef), r = hedef && hedef.getBoundingClientRect();
    if (hedef && r.width && r.height) {
      hedef.classList.add("rehber-hedef");
      var w = el.offsetWidth, h = el.offsetHeight, x = Math.min(Math.max(12, r.left), window.innerWidth - w - 12), y = r.bottom + 12;
      if (y + h > window.innerHeight - 12) y = r.top - h - 12;
      if (y < 12) y = Math.max(12, (window.innerHeight - h) / 2);
      el.style.left = x + "px"; el.style.top = y + "px"; el.style.bottom = "auto";
    } else { el.style.left = "50%"; el.style.top = "auto"; el.style.bottom = "24px"; el.style.transform = "translateX(-50%)"; }
    if (hedef && r.width) el.style.transform = "none";
    var ileri = el.querySelector('[data-r="ileri"]'); if (ileri) ileri.focus({ preventScroll: true });
    ercanSes(a.metin);
  }
  function rehberBitir(kaydet) {
    var el = $("rehber"); if (el) el.remove();
    document.querySelectorAll(".rehber-hedef").forEach(function (x) { x.classList.remove("rehber-hedef"); });
    if (ui.rehberAdim == null) return;
    ui.rehberAdim = null; ui.duraklat = false; ui.pencere = false; ui.sonTick = simdi(); ui.sonEylem = ui.sonTick;
    if (kaydet) { ui.rehberIste = false; try { localStorage.setItem("triyaj-rehber", "bitti"); } catch (e) { /* yok say */ } }
    if (ui.s && !ui.s.bitti) render();
  }

  // Duraklatma (Paradox oyunlarındaki gibi): saat durur; işlemler yine kendi süresini yer.
  function duraklatDegistir() {
    if (!ui.s || ui.s.bitti || ui.intro || ui.yakinAcik || ui.rehberAdim != null) return;
    ui.duraklat = !ui.duraklat; if (ui.duraklat) ui.duraklatSay++;
    ui.sonTick = simdi(); ui.sonEylem = ui.sonTick; render();
  }
  app.addEventListener("input", function (e) {
    if (e.target && e.target.id === "serbestSoru") { ui.ssMetin = e.target.value; return; }
    if (!e.target || e.target.id !== "terimAra") return;
    var q = trKucuk(e.target.value.trim());
    app.querySelectorAll(".terim-satir").forEach(function (r) { r.hidden = !!q && r.getAttribute("data-ara").indexOf(q) < 0; });
  });
  // PC kısayolları: 1-6 paneller, N e-Nabız, Esc pencereyi kapatır, Space/P duraklat
  document.addEventListener("keydown", function (e) {
    var geriTus = e.key === "z" || e.key === "Z";
    if (ui.ekran !== "vaka" || !ui.s || ui.s.bitti || ((e.ctrlKey || e.metaKey) && !geriTus) || e.altKey) return;
    if (ui.intro) {
      if (e.key === "Escape" || e.key === " " || e.key === "Enter") { if (ui.snAsama < 6) { sinemaAsama(6, true); e.preventDefault(); } return; }
      if (e.key === "Backspace") { vakalaraDon(); e.preventDefault(); return; }
      var alanlar = { "1": "kirmizi", "2": "sari", "3": "yesil" };
      if (ui.snAsama >= 6 && alanlar[e.key]) { triyajSec(alanlar[e.key]); e.preventDefault(); }
      return;
    }
    if (ui.rehberAdim != null) {
      if (e.key === "Enter") { ui.rehberAdim++; rehberCiz(); e.preventDefault(); }
      else if (e.key === "Escape") { rehberBitir(true); e.preventDefault(); }
      return;
    }
    if (ui.yakinAcik) {
      var n = parseInt(e.key, 10);
      if (n >= 1 && n <= ui.yakinAcik.secenekler.length) { yakinCevap(String(n - 1)); e.preventDefault(); }
      return;
    }
    var t = e.target;
    if (t && (t.tagName === "TEXTAREA" || (t.tagName === "INPUT" && t.type !== "radio"))) return;
    if (ui.olaylar && ui.olaylar.acik) {
      if (e.key === "Escape" || e.key === "o" || e.key === "O") { olaylarKapat(); e.preventDefault(); }
      return;
    }
    if (ui.masa && ui.masa.acik) {
      if (e.key === "Escape" || e.key === "m" || e.key === "M") { masaKapat(); e.preventDefault(); }
      return;
    }
    if (geriTus) { if (ui.geri) { geriAl(); e.preventDefault(); } return; }
    if ((e.key === "Enter" || e.key === " ") && t && t.tagName === "DIV" && t.getAttribute("role") === "button" && t.hasAttribute("data-act")) { t.click(); e.preventDefault(); return; }
    if (e.key === "Escape") {
      if (ui.hmsAcik) { ui.hmsAcik = false; render(); }
      else if (ui.enabiz.acik) { ui.enabiz.acik = false; render(); }
      else if (pc() && ui.pencere) sekmeSec("hasta");
      else if (!document.querySelector(".ipucu-kutu")) ayarAc("ses");
      e.preventDefault(); return;
    }
    if (e.key === "p" || e.key === "P" || (e.key === " " && !(t && /^(BUTTON|INPUT|SUMMARY|SELECT|A)$/.test(t.tagName)))) { duraklatDegistir(); e.preventDefault(); return; }
    if (ui.enabiz.acik) return;
    var hedef = null;
    for (var k in KISAYOL) if (KISAYOL[k] === e.key) hedef = k;
    if (hedef) { sekmeSec(hedef, true); e.preventDefault(); return; }
    if (e.key === "n" || e.key === "N") { ui.enabiz.acik = true; render(); e.preventDefault(); }
    if (e.key === "o" || e.key === "O") { olaylarAc(); e.preventDefault(); }
    if (e.key === "m" || e.key === "M") { masaAc(); e.preventDefault(); }
    if (e.key === "e" || e.key === "E") { ui.hmsAcik = !ui.hmsAcik; render(); e.preventDefault(); }
  });
  // Telefon ↔ masaüstü genişlik değişince düzeni yeniden kur
  if (genisMQ.addEventListener) genisMQ.addEventListener("change", function () { if (ui.ekran === "vaka") render(); });
  if (pcMQ.addEventListener) pcMQ.addEventListener("change", function () { if (ui.ekran === "vaka") render(); });
  // Görsel dosyası yoksa yer tutucu kalsın
  app.addEventListener("error", function (e) {
    var el = e.target;
    if (el && el.tagName === "IMG") { basarisizGorsel[el.getAttribute("src")] = true; el.parentNode && el.parentNode.removeChild(el); }
  }, true);

  /* ================= GERÇEK ZAMANLI SAAT ================= */
  // Her gerçek saniye = 1 vaka saniyesi. Sayfa gizliyken saat durur.
  setInterval(function () {
    if (ui.ekran !== "vaka" || !ui.s || document.hidden) return;
    monitorBip();
    if (ui.hmsBalon && simdi() >= ui.hmsBalon.bitis) { ui.hmsBalon = null; render(); }
    if (ui.geri && geriKalan(ui.s) <= 0) { ui.geri = null; ui.gorulen = -1; }
    if (ui.intro || ui.yakinAcik || ui.duraklat) { ui.sonTick = simdi(); return; } // sinematik, hasta yakını ve duraklatmada vaka saati durur
    var now = simdi(), dt = Math.min(5, (now - ui.sonTick) / 1000);
    ui.sonTick = now;
    M.ilerlet(ui.s, dt);
    if (ui.s.bitti) { sonucaGec(); return; }
    hemsireKontrol(ui.s, now);
    yakinKontrol(ui.s);
    if (ui.s.surum !== ui.gorulen || (ui.flashBitis && now >= ui.flashBitis) || (ui.bildirimBitis && now >= ui.bildirimBitis)) render(); else canliGuncelle();
  }, 250);
  document.addEventListener("visibilitychange", function () { ui.sonTick = simdi(); });

  girise();

  // PWA: servis çalışanı sadece http(s) üzerinde; file:// ile açınca oyun yine çalışır.
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    navigator.serviceWorker.register("sw.js").catch(function () { /* çevrimdışı önbellek olmadan da çalışır */ });
  }
})();
